# ---------------------------------------------------------------------------
# IndicPass -- password-strength engine configuration.
#
# Every number the meter uses is here. Nothing in src/indicpass/password/ may
# hardcode a threshold, a cost or a path: the whole point of the experiment in
# docs/password_strength_design.md is that the guess model can be recalibrated
# and re-run without editing Python.
#
# The units throughout are GUESSES -- the estimated number of attempts an
# attacker makes before reaching this password. Not bits, not entropy. See
# docs/password_strength_design.md for why that distinction is enforced.
# ---------------------------------------------------------------------------

# --- the 0-4 strength scale ------------------------------------------------
strength:
  # Boundaries in ESTIMATED GUESSES. A password scores the number of
  # thresholds it reaches or exceeds, so four thresholds give five bands.
  #
  # These are an INITIAL RESEARCH CONVENTION, not a calibrated result. They are
  # placed at the same order-of-magnitude boundaries common password-strength
  # tooling uses so that IndicPass and the baseline can be compared band for
  # band. They should be recalibrated once the Milestone 4 benchmark exists,
  # and the report must say which thresholds produced it.
  #
  # Written out in full rather than as 1.0e3: PyYAML follows YAML 1.1, where
  # `1.0e3` without a signed exponent is a STRING, not a float. Spelling the
  # digits avoids a threshold silently arriving as text.
  thresholds:
    - 1000.0            # 10^3  -- below this: online attack, no rate limiting
    - 1000000.0         # 10^6  -- below this: online attack, with rate limiting
    - 100000000.0       # 10^8  -- below this: offline attack, slow hash
    - 10000000000.0     # 10^10 -- below this: offline attack, fast hash
  labels:
    - Very Weak
    - Weak
    - Fair
    - Strong
    - Very Strong

# --- dictionaries ----------------------------------------------------------
dictionary:
  # Built offline by scripts/build_indicdict.py from the trained transliterator.
  # The runtime meter reads this file; it never invokes the neural model.
  dir: data/dictionaries
  files:
    hin: data/dictionaries/indicdict_hin.jsonl
  # Romanized forms outside this length band are not password material and are
  # dropped at build time. 3 keeps `jai`, `maa`; 16 is above any realistic
  # single-token password component.
  min_token_length: 3
  max_token_length: 16

  # Provenance tiers, MOST trustworthy first.
  #
  # This ordering is NOT a frequency ranking -- Aksharantar ships no usable
  # frequency data of its own (see docs/password_strength_design.md). It is an
  # ordering by how the pairs were produced: human romanizations first, curated
  # entity lists next, model-mined pairs last.
  #
  # Tiers are the FALLBACK pricing policy. An entry whose native form was found
  # in the external frequency table below is priced by its measured rank
  # instead, and only the remainder fall back to a tier -- using the tier's
  # size and position, never a within-tier rank, because no within-tier
  # ordering is justified by the data.
  tiers:
    - name: human_romanized
      subsources: [Dakshina]
      # Human-written romanizations of Hindi words: the spellings real Hindi
      # speakers actually type, which is exactly the password threat model.
    - name: curated_entities
      subsources: [Wikidata, AK-NEI, AK-NEF]
      # Named entities -- given names, surnames, places. `sharma`, `krishna`.
      # Flagged so the meter can report "this is a name" separately from
      # "this is a word", which are different advice to give someone.
      named_entity: true
    - name: curated_other
      subsources: [Existing, AK-Freq]
      # Other pre-existing transliteration corpora folded into Aksharantar.
    - name: mined
      subsources: [IndicCorp, Samanantar]
      # Automatically mined from monolingual/parallel corpora. Largest and
      # least precise; a word only in this tier is a weak signal.

  # Cap per tier at build time, applied after length filtering, taking tokens
  # in a deterministic order. Bounds both the build's model-inference cost and
  # the size of the committed dictionary. null means no cap.
  max_entries_per_tier:
    human_romanized: null
    curated_entities: null
    curated_other: null
    mined: 120000

# --- frequency source ------------------------------------------------------
# Where a word's position in an attacker's wordlist comes from.
#
# Aksharantar has no frequency data: its only numeric column is a mining
# log-likelihood on one subsource, and the subsource named AK-Freq is not
# frequency-ordered. Rather than invent one, the frequency is imported from an
# external, versioned table and joined through the NATIVE form.
#
# This is applied at BUILD time (scripts/build_indicdict.py) and baked into the
# dictionary file, so scoring stays a lookup and a benchmark run does not
# depend on which version of wordfreq happens to be installed.
frequency:
  enabled: true
  provider: wordfreq          # the only implementation; see the design doc for
                              # the alternatives that were considered
  wordlist: small             # the only Hindi list wordfreq ships
  # IndicPass language code -> the provider's own code. Kept explicit because a
  # silent hin/hi mis-join would produce an empty table and a dictionary that
  # merely looked like the frequency-free one.
  languages:
    hin: hi
  # When the model's predicted native form is unknown to the table, try the
  # spellings the corpus actually attests for that romanization. At CER 0.108
  # this recovers a meaningful share of entries; which route matched is
  # recorded per entry as frequency_matched_via.
  use_attested_forms: true

# --- matching --------------------------------------------------------------
matching:
  # Longest substring considered for a dictionary lookup. Above this a match
  # cannot be a single Hindi word, and the O(L^2) span scan gets pointless.
  max_match_length: 24

  # Shortest dictionary entry that may match at all, anywhere. Two-letter
  # "words" match inside almost any string and would make every password look
  # Indic.
  min_word_length: 3

  # Shortest PROPER SUBSTRING hit still treated as a real word rather than a
  # coincidence. Measured against the built dictionary, the probability that a
  # random lower-case string of length L is one of its keys is:
  #
  #     L=3  0.398      L=5  0.0055     L=7  0.0000037
  #     L=4  0.055      L=6  0.00023    L=8  0.00000014
  #
  # Three-letter hits are close to no evidence at all; four is the first length
  # where a hit is more surprising than not. Anything shorter than this that
  # is not the whole password is classed as a fragment and penalised below.
  min_substring_length: 4

  # Ablation switches. allow_substring_matches: false is the "whole-password
  # matches only" arm; allow_fragment_matches: false drops sub-threshold hits
  # entirely instead of penalising them.
  allow_substring_matches: true
  allow_fragment_matches: true

  # Multiplier on a dictionary hit's guess cost, by match class. 1.0 means the
  # cost is the attacker's wordlist position alone.
  #
  # These are a HEURISTIC correction, and they are labelled as such in the
  # design doc: the segmentation search already charges for splitting, so this
  # only corrects for the fact that a short entry in a 298k wordlist is often a
  # corpus artefact rather than a word anyone would attack with. The values
  # come from the sweep in results/reports/guess_model_sensitivity.md, which
  # also reports how much the benchmark moves when they change.
  class_penalties:
    exact_word: 1.0         # the password IS the word: no correction to make
    transformed_word: 1.0   # ... modulo case, already charged for separately
    substring_word: 1.0     # the segmentation's structure factor covers this
    fragment: 10.0          # a <4-character hit is weak evidence; charge for it

  # Cap on the number of segments the optimal-segmentation search considers.
  # Passwords longer than this are still scored; the search just stops adding
  # segments, which can only over-estimate guesses (never flatter a password).
  max_segmentation_depth: 12

# --- guess model -----------------------------------------------------------
scoring:
  # An attacker who tries k-segment structures must also enumerate the
  # structures themselves. Each extra segment multiplies the structure space by
  # this factor. Set to the same value zxcvbn uses so the two estimators differ
  # in their LEXICON, not in their combinatorics -- which is what makes the
  # Milestone 2 comparison an experiment about Indic awareness rather than
  # about two unrelated formulas.
  structure_factor: 10000

  # Cost of guessing a run of digits: digits_per_position ** length.
  digits_per_position: 10

  # A 4-digit run inside this window is a year, and years are far cheaper to
  # guess than arbitrary 4-digit strings. Inclusive.
  year_range: [1900, 2035]

  # Symbols an attacker is assumed to try, as a count. The printable ASCII
  # punctuation set is 33 characters.
  symbol_alphabet_size: 33

  # Cardinality used for a span the meter could not explain. Either an integer
  # or the literal string "observed" (the character classes actually present in
  # the password: 26 / 36 / 95).
  #
  # Set to 10 after measurement, not intuition. The sweep in
  # results/reports/guess_model_sensitivity.md found that "observed" accounted
  # for the ENTIRE divergence from the baseline on random controls -- +7.12
  # orders of magnitude, against a -7.33 effect from this one setting -- while
  # the Indic lexicon's own contribution is around 0.6. Left at "observed", any
  # benchmark would have been measuring an alphabet assumption and calling it
  # Indic awareness.
  #
  # It is also the safer model on its own terms. The classical alphabet-size
  # formula assumes an attacker learns nothing from how people pick characters,
  # which over-estimates strength -- the dangerous direction for a meter to err
  # in. A flat per-character cost is deliberately conservative, and is what
  # zxcvbn uses, so the two estimators now differ in their LEXICON and not in
  # this.
  #
  # "observed" remains available and is reported as an arm of the sensitivity
  # analysis. Whichever is used must be stated in any published number.
  bruteforce_cardinality: 10
  character_class_sizes:
    lowercase: 26
    uppercase: 26
    digits: 10
    symbols: 33

  # Floor on the guess estimate. A password cannot cost less than one guess.
  min_guesses: 1.0

# --- baseline --------------------------------------------------------------
# The generic estimator IndicPass is measured against. Without it, no
# comparative claim may be made at all -- so it is on by default and a run that
# could not load it says so in the report rather than quietly omitting it.
baseline:
  enabled: true
  implementation: zxcvbn

# --- PCFG ------------------------------------------------------------------
# Milestone 3. A probability model over passwords, from which a guess number is
# derived by counting rather than by a formula. It runs ALONGSIDE the estimator
# above, never instead of it: replacing the shipped estimator is a decision the
# comparison has to earn, and it has not been made here.
#
# Read docs/password_strength_design.md section 14 before changing anything in
# this block. Every value is either learned from data (and therefore not here)
# or an explicit prior (and therefore here, with its status stated).
pcfg:
  enabled: true
  # Trained artefacts. Small and committed: they hold the guess curve and the
  # hyper-parameters, not the grammar -- the grammar is refitted from the
  # dictionary at load time and a fingerprint proves the two match.
  files:
    hin: data/pcfg/pcfg_hin.json

  grammar:
    # Character-model order over Romanized spellings. This is the component
    # that lets a Hindi word MISSING from the dictionary still be recognised as
    # Hindi-shaped, which is the single largest limitation Milestone 2 measured.
    # Swept over 3/4/5 in results/reports/pcfg_benchmark_hin.md.
    ngram_order: 4
    # Provenance tiers the character model trains on. Empty = all of them. The
    # `mined` tier is 120k automatically extracted pairs, so restricting to the
    # curated tiers is a real alternative and is reported as an ablation arm.
    ngram_tiers: []

    # --- the structure prior. NOT LEARNED. -------------------------------
    # Learning P(structure) requires a corpus of real passwords. This project
    # has none, and fitting it to the synthetic benchmark generator and then
    # evaluating on that generator's output would measure the generator. So:
    #
    #   P(k segments) = truncated geometric, renormalised over 1..max_segments
    #
    # Geometric is the maximum-entropy distribution on the positive integers
    # once a mean is fixed -- the least that can be assumed while assuming
    # anything at all. This is an ASSUMPTION, it is load-bearing, and the
    # benchmark reports how far the conclusion moves when it changes.
    segment_continuation: 0.5
    # Cap on segments considered. A password needing more is reported as
    # unsupported and priced by the brute-force floor, which is the honest
    # outcome: the grammar has nothing to say about it.
    max_segments: 8

    # P(category) for each segment. Empty = uniform over the five categories
    # (word, unknown, digits, year, symbols). Uniform is not a placeholder: with
    # no password corpus, maximum entropy is the only choice that does not
    # assert something unmeasured. ASSUMPTION.
    category_prior: {}

    # P(length) within a digit or symbol run: truncated geometric again, same
    # reasoning and the same status. ASSUMPTION.
    digit_length_decay: 0.5
    symbol_length_decay: 0.35
    # Longest single terminal the grammar will derive.
    max_run_length: 16

    # How entries with NO observed frequency enter the word distribution.
    #   tier_coverage  weight = the tier's measured frequency coverage
    #   uniform        every tier weighted alike
    #   excluded       dropped from the word category; the n-gram explains them
    # Their probability is bounded above by the smallest OBSERVED probability --
    # a word absent from a 26,653-word frequency list is at most as common as
    # the rarest word on it. That bound is derived from the data; the tier
    # scaling is a policy. No frequency is invented for them.
    unranked_policy: tier_coverage

  estimator:
    # Derivations drawn to build the guess curve. The curve is the artefact;
    # this is a one-off training cost, not a scoring cost.
    samples: 200000
    # The only randomness anywhere in the pipeline. Changing it changes the
    # artefact, which is why it is recorded in the artefact and in every report.
    sample_seed: 42
    # Points kept in the stored curve, sampled geometrically so the head stays
    # dense where a decade of probability is a decade of guesses.
    curve_points: 2000
    # Report min(grammar, brute force). The floor is the Milestone 2
    # brute-force assumption, kept OUTSIDE the probability model on purpose: an
    # attacker picks the cheaper of "use the model" and "enumerate strings", and
    # a model with no floor over-estimates random strings -- the direction
    # Milestone 2 established is the dangerous one for a meter to err in.
    # Both numbers are reported separately; turning this off is an ablation arm.
    bruteforce_floor: true

  evaluation:
    report_prefix: pcfg_benchmark
    targeted_prefix: pcfg_targeted
    # Random strings per cell in the control sweep. The control is what decides
    # whether any Indic result is believable, so it is not optional.
    random_control_samples: 300

# --- reference attack ------------------------------------------------------
# Milestone 4. The first quantity in this project that is not a model output:
# the position at which a fully specified attacker actually emits a password.
#
# Read docs/password_strength_design.md section 15 before changing anything
# here. Every value below changes the observed ranks the three estimators are
# scored against, so a report produced under different settings is NOT
# comparable with one produced under these -- which is why the settings, the
# rule programme and a fingerprint over both are written into every report.
reference_attack:
  enabled: true

  # How the attacker orders their wordlist.
  #
  #   frequency  ranked entries by observed corpus frequency, then the rest in
  #              seeded-shuffle order. What a real attacker with a frequency
  #              table does -- and the arm that SHARES EVIDENCE with IndicPass
  #              and the PCFG, both built on that same wordfreq table. A result
  #              that appears only here is a statement about shared evidence.
  #   shuffled   every spelling in seeded-shuffle order. No estimator has an
  #              informational advantage. This is the independence arm.
  #   length     shortest first, then alphabetical. Frequency-free but not
  #              random, which separates "no frequency" from "no information".
  #
  # The report runs all three. This names the primary one.
  lexicon_order: frequency
  # Entries the attacker holds. null = the whole dictionary, which is the least
  # arbitrary choice: any cap is a number nobody can justify.
  lexicon_size: null

  # Seeds the shuffle used for entries with no observed frequency. The only
  # randomness in the attack; recorded in the artefact and in every report.
  seed: 42

  # The attacker's budget, in candidates. Rules are added cheapest-first until
  # it is exhausted; a password only the dropped rules could produce is
  # reported UNCOVERED and given no rank.
  #
  # 10^16 is roughly two hours of one eight-GPU rig against MD5, and roughly
  # thirty million years against bcrypt at cost 10. The same number is a
  # formality for one hash and impossible for another, which is the honest way
  # to state a budget.
  #
  # It is deliberately large enough that coverage measures the LEXICON rather
  # than the budget. That is a stated design choice, and the report carries a
  # 10^12 arm showing what a smaller one costs.
  max_candidates: 10000000000000000.0

  # Rule programme.
  #   size    ascending block size. Absent information about which rule built
  #           the target, treating rules as equally likely makes expected
  #           cracks-per-guess inversely proportional to block size, so
  #           smallest-first maximises yield. Maximum entropy, same as the
  #           PCFG's structure prior, and for the same reason: no corpus.
  #   family  an explicit human-written precedence over suffix families.
  # ASSUMPTION either way; the report measures how far the conclusion moves.
  rule_order: size

  # Years the attacker tries. A superset of the generator's 1950-2025 window:
  # a superset can only push a target further down the enumeration, never
  # closer, so coverage cannot be an artefact of a matched window.
  year_range: [1940, 2029]
  # Shift-number row plus the four separators that dominate published
  # password-composition studies. Also a strict superset of the generator's
  # ten, for the same reason.
  symbols: "!@#$%^&*()-_.+"
  # Longest digit run appended, and longest run after a symbol.
  max_digits: 5
  max_symbol_digits: 3
  # word+word rules -- the combinator attack. Turning this off is an ablation
  # arm and it is what makes the multi-word category reachable at all.
  combinator: true

  evaluation:
    report_prefix: reference_attack

# --- character attack ------------------------------------------------------
# Milestone 5. The attacker that can reach a spelling IndicDict has never seen.
#
# Milestone 4's enumeration is a wordlist crossed with rules, so it could not
# reach a single one of the 872 out-of-lexicon targets -- which is exactly the
# population Milestone 3's central claim is about. This attack replaces the
# wordlist with a character model, so every lower-case letter string within the
# bounds below is in its universe whether or not the dictionary contains it.
#
# Read docs/password_strength_design.md section 16 before changing anything
# here. Every value changes the observed ranks, so a report produced under
# different settings is NOT comparable with one produced under these.
character_attack:
  enabled: true

  # Where the character statistics come from.
  #   indicdict  trained on the dictionary's romanized keys. SHARES TRAINING
  #              EVIDENCE with the PCFG's own n-gram -- different order,
  #              smoothing and implementation, but the same spellings. A result
  #              that appears only here is partly a statement about shared data.
  #   uniform    no character statistics at all: the ordering collapses to
  #              length-then-lexicographic. The null arm, in which no estimator
  #              has any informational advantage.
  # The report runs both. This names the primary one.
  model: indicdict
  # Context length. 3 rather than the PCFG's 4: the counting table is indexed by
  # context, so order 4 would be 17,576 of them, and a deliberately different
  # order keeps the attack from being a re-implementation of what it scores.
  # Swept over 2/3 in the report's sensitivity arms.
  order: 3
  # Additive (Laplace) smoothing. alpha = 1 is the conventional parameter-free
  # choice; the report carries a 0.1 arm because it is still an assumption.
  smoothing: 1.0
  # One level is this much log10 cost. Quantisation is what makes the universe
  # countable: levels are integers, so the number of candidates at each one is a
  # dynamic programme rather than a walk over 10^16 strings. Finer means a more
  # faithful ordering and a taller table; 0.25 and 0.5 are both reported.
  precision: 0.25

  # The attacker's budget, in candidates. INHERITED FROM reference_attack above
  # so that the two attacks cost the same and the difference in their coverage
  # is a statement about the candidate model rather than about how long each was
  # allowed to run. Levels are bought cheapest-first until this is exhausted.
  max_candidates: 10000000000000000.0
  # Height of the counting table. A structural bound, not a policy one: the
  # build refuses to let this rather than the budget end the enumeration, and
  # the report records which of the two bound the universe.
  level_ceiling: 128

  # Stem length band. 16 is dictionary.max_token_length above -- the same bound
  # the dictionary build uses for what counts as password material -- and it
  # covers 1,395 of the 1,400 benchmark targets' letter bodies.
  min_stem_length: 1
  max_stem_length: 16

  # Decoration. The same families and the same superset reasoning as
  # reference_attack: a superset of the generator's symbols and years can only
  # push a target further down the enumeration, never closer.
  year_range: [1940, 2029]
  symbols: "!@#$%^&*()-_.+"
  max_digits: 5
  max_symbol_digits: 3

  # Hold-out arm: train the character model on this share of the spellings,
  # drawn with the seed below. 1.0 is the shipped configuration; the report runs
  # a 0.5 arm to ask whether the attack's reach depends on the PARTICULAR
  # spellings the dictionary holds or on the shape of the language.
  training_share: 1.0
  training_seed: 42

  # Confidence intervals on the primary metrics.
  bootstrap:
    resamples: 2000
    seed: 42
    confidence: 0.95
    # Populations smaller than this get point estimates and no interval. An
    # interval over thirty targets would be wider than the quantity it
    # describes, and reporting one would suggest a precision that is not there.
    min_samples: 20

  evaluation:
    report_prefix: milestone5_oov_attack

# --- evaluation ------------------------------------------------------------
evaluation:
  report_dir: results/reports
  # The benchmark corpus is GENERATED, not stored. Passwords are password
  # material even when synthetic, so what reaches disk is sample_id + category
  # + metrics; reproducibility comes from the generator plus this seed.
  seed: 42
  benchmark:
    # Samples per category. Categories are defined in
    # src/indicpass/password/benchmark.py.
    samples_per_category: 200
    report_prefix: password_benchmark
  # The curated probe set for the coverage report is a MEASURING INSTRUMENT.
  # Words are never added to the dictionary to make it look better; see
  # docs/password_strength_design.md.
  coverage:
    report_prefix: indicdict_coverage
